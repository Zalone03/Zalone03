name: gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gerar svgs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00b86f&color_dots=#ebedf0,#9be9c8,#40d99a,#00b86f,#007a4d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF9C&color_dots=#161b22,#003d26,#007a4d,#00b86f,#00FF9C

      - name: publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
